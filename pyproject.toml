[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sesh-compresh"
dynamic = ["version"]
description = "Transactional local session archiving and allowlisted build-cache cleanup"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "rexbrahh" }]
keywords = ["archiving", "compression", "zstd", "session", "cleanup"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]
dependencies = []

[project.optional-dependencies]
encryption = ["keyring>=25.6"]

[project.urls]
Homepage = "https://github.com/rexbrahh/sesh-compresh"
Repository = "https://github.com/rexbrahh/sesh-compresh.git"

[project.scripts]
sesh-compresh = "sesh_compresh.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "sesh_compresh.__version__" }
