name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
        python: ["3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install zstd (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: install zstd (macos)
        if: runner.os == 'macOS'
        run: brew install zstd || true

      - name: lint
        run: pipx run ruff check src tests

      - name: test
        run: PYTHONPATH=src python -m unittest discover -s tests
